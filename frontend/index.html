<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User List</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    .user { margin: 10px 0; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
  </style>
</head>
<body>
  <h1>Users</h1>
  <div id="user-list"></div>

  <script>
    fetch('https://users-odyd.onrender.com/api/users')
      .then(res => res.json())
      .then(users => {
        const list = document.getElementById('user-list');
        users.forEach(user => {
          const div = document.createElement('div');
          div.className = 'user';
          div.innerHTML = `<strong>${user.name}</strong><br>Email: ${user.email}`;
          list.appendChild(div);
        });
      })
      .catch(err => {
        document.getElementById('user-list').innerText = 'Failed to load users';
        console.error(err);
      });
  </script>
</body>
</html>
